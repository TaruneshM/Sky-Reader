<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <rect width="880" height="440" fill="#0f172a" rx="8"/>
  <text x="440" y="34" fill="#f8fafc" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Figure 5: System Latency Distribution &amp; Execution Reliability Profile</text>
  <text x="440" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Canonical Response Times (N=50) and First-Attempt vs. Eventual Reliability</text>

  <!-- Legend -->
  <rect x="220" y="70" width="14" height="14" fill="#ef4444" rx="3"/>
  <text x="240" y="82" fill="#cbd5e1" font-size="12" font-family="system-ui, -apple-system, sans-serif">Baseline LLM</text>
  <rect x="410" y="70" width="14" height="14" fill="#f59e0b" rx="3"/>
  <text x="430" y="82" fill="#cbd5e1" font-size="12" font-family="system-ui, -apple-system, sans-serif">Tool-Using Agent</text>
  <rect x="610" y="70" width="14" height="14" fill="#10b981" rx="3"/>
  <text x="630" y="82" fill="#cbd5e1" font-size="12" font-family="system-ui, -apple-system, sans-serif">Complete Sky Reader</text>

  <!-- Panel A: Latency (Left) -->
  <rect x="50" y="98" width="410" height="315" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="255" y="124" fill="#f8fafc" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Mean &amp; P95 Latency (Seconds)</text>
  <text x="255" y="139" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Canonical end-to-end response generation &amp; validation latency</text>

  <!-- Left grid: max 70s, h_max = 200 -> h = (val / 70) * 200 -->
  <line x1="90" y1="350" x2="430" y2="350" stroke="#475569" stroke-width="1"/>
  <line x1="90" y1="300" x2="430" y2="300" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>
  <line x1="90" y1="250" x2="430" y2="250" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>
  <line x1="90" y1="200" x2="430" y2="200" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>
  <line x1="90" y1="150" x2="430" y2="150" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>

  <text x="82" y="354" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">0s</text>
  <text x="82" y="304" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">17.5s</text>
  <text x="82" y="254" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">35s</text>
  <text x="82" y="204" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">52.5s</text>
  <text x="82" y="154" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">70s</text>

  <!-- Group 1: Baseline (Mean 2.92s, P95 9.11s) -->
  <!-- 2.92s -> h = 8.3, y = 341.7 -->
  <rect x="120" y="342" width="24" height="8" fill="#ef4444" rx="2"/>
  <text x="132" y="337" fill="#ef4444" font-size="9" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">2.9s</text>
  <!-- 9.11s -> h = 26.0, y = 324.0 -->
  <rect x="148" y="324" width="24" height="26" fill="#f87171" rx="2"/>
  <text x="160" y="319" fill="#f87171" font-size="9" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">9.1s</text>
  <text x="146" y="370" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Baseline</text>

  <!-- Group 2: Tool Agent (Mean 19.38s, P95 37.17s) -->
  <!-- 19.38s -> h = 55.4, y = 294.6 -->
  <rect x="220" y="295" width="24" height="55" fill="#f59e0b" rx="2"/>
  <text x="232" y="289" fill="#f59e0b" font-size="9" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">19.4s</text>
  <!-- 37.17s -> h = 106.2, y = 243.8 -->
  <rect x="248" y="244" width="24" height="106" fill="#fbbf24" rx="2"/>
  <text x="260" y="238" fill="#fbbf24" font-size="9" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">37.2s</text>
  <text x="246" y="370" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tool Agent</text>

  <!-- Group 3: Sky Reader (Mean 28.20s, P95 59.88s) -->
  <!-- 28.20s -> h = 80.6, y = 269.4 -->
  <rect x="320" y="269" width="24" height="81" fill="#10b981" rx="2"/>
  <text x="332" y="263" fill="#10b981" font-size="9" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">28.2s</text>
  <!-- 59.88s -> h = 171.1, y = 178.9 -->
  <rect x="348" y="179" width="24" height="171" fill="#34d399" rx="2"/>
  <text x="360" y="173" fill="#34d399" font-size="9" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">59.9s</text>
  <text x="346" y="370" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Sky Reader</text>

  <text x="255" y="400" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Solid bar: Mean Latency | Lighter bar: 95th Percentile Latency</text>

  <!-- Panel B: Reliability & Completion Rates (Right) -->
  <rect x="480" y="98" width="350" height="315" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="655" y="124" fill="#f8fafc" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Execution Reliability &amp; Completion Rate</text>
  <text x="655" y="139" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Comparing First-Attempt vs. Eventual Success</text>

  <!-- Baseline Card -->
  <rect x="500" y="160" width="310" height="65" fill="#0f172a" rx="4" stroke="#ef4444" stroke-width="1"/>
  <text x="515" y="180" fill="#ef4444" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Baseline LLM</text>
  <text x="515" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif">First-Attempt: 100% (50/50) | Eventual: 100%</text>
  <text x="515" y="212" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">0 Timeouts (single prompt forward pass)</text>

  <!-- Tool Agent Card -->
  <rect x="500" y="235" width="310" height="65" fill="#0f172a" rx="4" stroke="#f59e0b" stroke-width="1"/>
  <text x="515" y="255" fill="#f59e0b" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Tool-Using Agent</text>
  <text x="515" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif">First-Attempt: 100% (50/50) | Eventual: 100%</text>
  <text x="515" y="287" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">0 Timeouts (unbounded single-turn tool calls)</text>

  <!-- Sky Reader Card -->
  <rect x="500" y="310" width="310" height="90" fill="#0f172a" rx="4" stroke="#10b981" stroke-width="1"/>
  <text x="515" y="330" fill="#10b981" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Complete Sky Reader</text>
  <text x="515" y="348" fill="#f8fafc" font-size="11" font-family="system-ui, -apple-system, sans-serif">First-Attempt: 86.0% (43/50) | <tspan fill="#34d399" font-weight="bold">Eventual: 100% (50/50)</tspan></text>
  <text x="515" y="364" fill="#fcd34d" font-size="10" font-family="system-ui, -apple-system, sans-serif">7 First-attempt timeouts (multi-location &amp; 48h arrays)</text>
  <text x="515" y="378" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">0 Runtime crashes or uncaught exceptions</text>
</svg>
