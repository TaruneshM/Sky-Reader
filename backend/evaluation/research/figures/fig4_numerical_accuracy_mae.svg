<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <rect width="880" height="440" fill="#0f172a" rx="8"/>
  <text x="440" y="34" fill="#f8fafc" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Figure 4: Physical Variable Error Decomposition vs. Extraction Accuracy</text>
  <text x="440" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Disentangling Tolerance Accuracy from Dimensional Physical MAE (°C, mm, km/h, %)</text>

  <!-- Legend -->
  <rect x="220" y="70" width="14" height="14" fill="#ef4444" rx="3"/>
  <text x="240" y="82" fill="#cbd5e1" font-size="12" font-family="system-ui, -apple-system, sans-serif">Baseline LLM</text>
  <rect x="410" y="70" width="14" height="14" fill="#f59e0b" rx="3"/>
  <text x="430" y="82" fill="#cbd5e1" font-size="12" font-family="system-ui, -apple-system, sans-serif">Tool-Using Agent</text>
  <rect x="610" y="70" width="14" height="14" fill="#10b981" rx="3"/>
  <text x="630" y="82" fill="#cbd5e1" font-size="12" font-family="system-ui, -apple-system, sans-serif">Complete Sky Reader</text>

  <!-- Panel A: Numerical Extraction Accuracy (Left) -->
  <rect x="50" y="98" width="240" height="315" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="170" y="124" fill="#f8fafc" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Numerical Accuracy (%)</text>
  <text x="170" y="139" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tolerance-bound ground truth match</text>

  <!-- Left grid -->
  <line x1="75" y1="365" x2="265" y2="365" stroke="#475569" stroke-width="1"/>
  <line x1="75" y1="315" x2="265" y2="315" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>
  <line x1="75" y1="265" x2="265" y2="265" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>
  <line x1="75" y1="215" x2="265" y2="215" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>
  <line x1="75" y1="165" x2="265" y2="165" stroke="#334155" stroke-dasharray="3" stroke-width="1"/>

  <text x="70" y="369" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">0%</text>
  <text x="70" y="319" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">25%</text>
  <text x="70" y="269" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">50%</text>
  <text x="70" y="219" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">75%</text>
  <text x="70" y="169" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">100%</text>

  <!-- Left Bars (max h = 200) -->
  <!-- Baseline: 14.3% -> h = 28.6, y = 336.4 -->
  <rect x="90" y="336" width="40" height="29" fill="#ef4444" rx="3"/>
  <text x="110" y="330" fill="#ef4444" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">14.3%</text>
  <text x="110" y="380" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Base</text>

  <!-- Tool: 48.1% -> h = 96.2, y = 268.8 -->
  <rect x="150" y="269" width="40" height="96" fill="#f59e0b" rx="3"/>
  <text x="170" y="262" fill="#f59e0b" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">48.1%</text>
  <text x="170" y="380" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tool</text>

  <!-- Sky Reader: 34.1% -> h = 68.2, y = 296.8 -->
  <rect x="210" y="297" width="40" height="68" fill="#10b981" rx="3"/>
  <text x="230" y="290" fill="#10b981" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">34.1%</text>
  <text x="230" y="380" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SkyR</text>

  <text x="170" y="402" fill="#38bdf8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">* Fallback filters unverified claims</text>

  <!-- Panel B: Variable-Specific MAE (Right) -->
  <rect x="310" y="98" width="520" height="315" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="570" y="124" fill="#f8fafc" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Physical Variable-Specific MAE (Lower is better)</text>
  <text x="570" y="139" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Normalized physical error metrics across matched numerical claims</text>

  <!-- Sub-columns in Panel B -->
  <!-- Col 1: Temperature (°C) -->
  <text x="375" y="165" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Temperature (°C)</text>
  <!-- Scale max 10°C, h_max = 140 -> h = (val / 10) * 140 -->
  <line x1="330" y1="340" x2="420" y2="340" stroke="#475569" stroke-width="1"/>
  <!-- Base: 7.27°C -> h = 101.8, y = 238.2 -->
  <rect x="335" y="238" width="22" height="102" fill="#ef4444" rx="2"/>
  <text x="346" y="232" fill="#ef4444" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">7.3°</text>
  <!-- Tool: 4.03°C -> h = 56.4, y = 283.6 -->
  <rect x="362" y="284" width="22" height="56" fill="#f59e0b" rx="2"/>
  <text x="373" y="278" fill="#f59e0b" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">4.0°</text>
  <!-- Sky: 5.35°C -> h = 74.9, y = 265.1 -->
  <rect x="389" y="265" width="22" height="75" fill="#10b981" rx="2"/>
  <text x="400" y="259" fill="#10b981" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">5.4°</text>
  <text x="375" y="360" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">N=33</text>

  <!-- Col 2: Precipitation (mm) -->
  <text x="500" y="165" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Rain Amount (mm)</text>
  <line x1="455" y1="340" x2="545" y2="340" stroke="#475569" stroke-width="1"/>
  <!-- Scale max 60mm, h_max = 140 -> h = (val / 60) * 140 -->
  <!-- Base: 54.50 mm -> h = 127.2, y = 212.8 -->
  <rect x="460" y="213" width="22" height="127" fill="#ef4444" rx="2"/>
  <text x="471" y="207" fill="#ef4444" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">54.5</text>
  <!-- Tool: 12.21 mm -> h = 28.5, y = 311.5 -->
  <rect x="487" y="312" width="22" height="28" fill="#f59e0b" rx="2"/>
  <text x="498" y="306" fill="#f59e0b" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">12.2</text>
  <!-- Sky: 8.07 mm -> h = 18.8, y = 321.2 -->
  <rect x="514" y="321" width="22" height="19" fill="#10b981" rx="2"/>
  <text x="525" y="315" fill="#10b981" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">8.1</text>
  <text x="500" y="360" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">N=12</text>

  <!-- Col 3: Wind Speed (km/h) -->
  <text x="625" y="165" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Wind Speed (km/h)</text>
  <line x1="580" y1="340" x2="670" y2="340" stroke="#475569" stroke-width="1"/>
  <!-- Scale max 15 km/h, h_max = 140 -> h = (val / 15) * 140 -->
  <!-- Base: 12.20 km/h -> h = 113.9, y = 226.1 -->
  <rect x="585" y="226" width="22" height="114" fill="#ef4444" rx="2"/>
  <text x="596" y="220" fill="#ef4444" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">12.2</text>
  <!-- Tool: 0.73 km/h -> h = 6.8, y = 333.2 -->
  <rect x="612" y="333" width="22" height="7" fill="#f59e0b" rx="2"/>
  <text x="623" y="327" fill="#f59e0b" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">0.7</text>
  <!-- Sky: 6.75 km/h -> h = 63.0, y = 277 -->
  <rect x="639" y="277" width="22" height="63" fill="#10b981" rx="2"/>
  <text x="650" y="271" fill="#10b981" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">6.8</text>
  <text x="625" y="360" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">N=10</text>

  <!-- Col 4: Rain Probability (%) -->
  <text x="750" y="165" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Probability (%)</text>
  <line x1="705" y1="340" x2="795" y2="340" stroke="#475569" stroke-width="1"/>
  <!-- Scale max 50%, h_max = 140 -> h = (val / 50) * 140 -->
  <!-- Base: 20.75% -> h = 58.1, y = 281.9 -->
  <rect x="710" y="282" width="22" height="58" fill="#ef4444" rx="2"/>
  <text x="721" y="276" fill="#ef4444" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">20.8%</text>
  <!-- Tool: 39.17% -> h = 109.7, y = 230.3 -->
  <rect x="737" y="230" width="22" height="110" fill="#f59e0b" rx="2"/>
  <text x="748" y="224" fill="#f59e0b" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">39.2%</text>
  <!-- Sky: 0.00% -> h = 2, y = 338 -->
  <rect x="764" y="338" width="22" height="2" fill="#10b981" rx="2"/>
  <text x="775" y="332" fill="#10b981" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">0.0%</text>
  <text x="750" y="360" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">N=9</text>

  <text x="570" y="396" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Note: Tool Agent confused probability (%) with accumulation (mm) in 4 cases; Sky Reader achieved exact 0.0% error.</text>
</svg>